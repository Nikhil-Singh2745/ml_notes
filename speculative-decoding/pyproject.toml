[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specdecode-lab"
version = "0.1.0"
description = "Learning greedy speculative decoding with two local Qwen3 models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch==2.9.1",
    "transformers==4.57.1",
    "accelerate==1.11.0",
    "safetensors==0.6.2",
]

[project.scripts]
specdecode = "specdecode_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

